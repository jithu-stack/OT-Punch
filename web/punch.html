<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OT Punch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16181B">
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--alu-100)">
<div class="phone">

  <!-- LOGIN / ACTIVATE -->
  <section id="loginView" class="login" hidden>
    <div class="wordmark"><span class="k">KBROS</span><span class="o">OMN<b>!</b></span></div>
    <div>
      <h1>OT Punch</h1>
      <div style="font-size:16px;color:var(--text-secondary);margin-top:4px">Log in to punch today's work.</div>
    </div>
    <div class="seg" id="loginMode" style="align-self:flex-start">
      <button data-m="login" aria-pressed="true">Log in</button>
      <button data-m="activate" aria-pressed="false">First time? Activate</button>
    </div>
    <form id="loginForm" class="stack" novalidate>
      <div class="field"><label for="lEmp">EMP code</label><input id="lEmp" autocomplete="username" autocapitalize="characters" placeholder="e.g. HR703" required></div>
      <div class="field" id="actField" hidden><label for="lAct">Activation code (from your supervisor)</label><input id="lAct" inputmode="numeric" autocomplete="one-time-code"></div>
      <div class="field"><label for="lPin" id="lPinLabel">6-digit PIN</label><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" required></div>
      <div class="field" id="pin2Field" hidden><label for="lPin2">Repeat new PIN</label><input id="lPin2" type="password" inputmode="numeric" autocomplete="new-password"></div>
      <button class="btn primary big" id="loginBtn" type="submit" style="margin-top:8px">Log in</button>
      <p class="muted" id="loginMsg" style="margin:0"></p>
    </form>
  </section>

  <!-- PUNCH -->
  <section id="punchView" hidden>
    <div class="hero">
      <div class="avatar" id="avatar"></div>
      <div class="grow"><div class="name" id="who"></div><div class="sub" id="whoSub"></div></div>
      <button class="iconbtn" id="logoutBtn" aria-label="Log out" hidden><i class="icon-log-out"></i></button>
    </div>
    <div class="facts" id="facts"></div>
    <div class="pad stack">
      <div class="statusbar" id="status" role="status"></div>
      <div class="stack" id="actions"></div>
    </div>
    <div class="pad" style="padding-top:0">
      <div class="sectitle"><span>Today's punches · <span class="mono" id="workDate"></span></span><button class="btn sm ghost" id="refreshBtn"><i class="icon-refresh-cw"></i>Refresh</button></div>
      <ul class="steps" id="steps"></ul>
    </div>
    <input type="file" id="camera" accept="image/*" capture="user" hidden>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="punch.js"></script>
</body>
</html>
